<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quota Limits Exceeded</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url('Screenshot 2026-08-24 142429.png') no-repeat center center fixed;
            background-size: cover;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .bouncing-text {
            position: absolute;
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.8), 0 0 40px rgba(255, 0, 0, 0.5), 2px 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="bouncing-text" id="bouncer">Quota limits exeeded</div>

    <script>
        const bouncer = document.getElementById('bouncer');
        
        let posX = Math.random() * (window.innerWidth - bouncer.offsetWidth);
        let posY = Math.random() * (window.innerHeight - bouncer.offsetHeight);
        
        // Speed and movement vector
        let speedX = 3;
        let speedY = 2.5;

        function update() {
            const rect = bouncer.getBoundingClientRect();
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;

            posX += speedX;
            posY += speedY;

            // Bounce off left/right edges
            if (posX + rect.width >= winWidth) {
                posX = winWidth - rect.width;
                speedX = -speedX;
            } else if (posX <= 0) {
                posX = 0;
                speedX = -speedX;
            }

            // Bounce off top/bottom edges
            if (posY + rect.height >= winHeight) {
                posY = winHeight - rect.height;
                speedY = -speedY;
            } else if (posY <= 0) {
                posY = 0;
                speedY = -speedY;
            }

            bouncer.style.left = posX + 'px';
            bouncer.style.top = posY + 'px';

            requestAnimationFrame(update);
        }

        // Adjust position dynamically if window size changes
        window.addEventListener('resize', () => {
            if (posX > window.innerWidth - bouncer.offsetWidth) {
                posX = window.innerWidth - bouncer.offsetWidth;
            }
            if (posY > window.innerHeight - bouncer.offsetHeight) {
                posY = window.innerHeight - bouncer.offsetHeight;
            }
        });

        requestAnimationFrame(update);
    </script>
</body>
</html>
